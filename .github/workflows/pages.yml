name: Deploy Only Us to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out safe source
        uses: actions/checkout@v4
      - name: Ensure private pairing files are never published
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(pair-config\.json|pair-secret\.private|.*\.apk|.*\.idsig|.*\.jks|\.env(\..*)?)$'; then
            echo 'Refusing to publish a pairing key, APK, signing key, or environment file.'
            exit 1
          fi
          test -f public/index.html
          test ! -e public/pair-config.json
      - name: Assemble static web app
        run: |
          mkdir _site
          cp -a public/. _site/
          test ! -e _site/pair-config.json
          test -f _site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
