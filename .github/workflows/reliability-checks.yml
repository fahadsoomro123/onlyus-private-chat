name: Only Us reliability checks

on:
  push:
    branches: [reliability-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check client JavaScript syntax
        run: npm run check:syntax
      - name: Install and check backend
        working-directory: backend
        run: |
          npm install --no-audit --no-fund
          npm run check

  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile Android debug APK
        run: gradle -p android assembleDebug --no-daemon
