name: Only Us reliability checks

on:
  push:
    branches: [reliability-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check client JavaScript syntax
        run: npm run check:syntax
      - name: Install and check backend
        working-directory: backend
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test
      - name: Smoke-test backend health endpoint
        working-directory: backend
        env:
          ONLYUS_PAIR_TOKEN: reliability-ci-only-token-000000000000000000000000000000000000000000
          PORT: '18787'
        run: |
          npm start > /tmp/onlyus-backend.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..15}; do
            if curl --fail --silent http://127.0.0.1:18787/healthz; then
              echo
              exit 0
            fi
            sleep 1
          done
          cat /tmp/onlyus-backend.log
          exit 1
      - name: Check Cloudflare Worker
        working-directory: cloudflare/onlyus-worker
        run: |
          npm run check
          npm test

  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile Android debug APK
        run: gradle -p android assembleDebug --no-daemon
