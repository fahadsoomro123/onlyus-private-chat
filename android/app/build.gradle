plugins {
    id 'com.android.application'
}

def signingFile = rootProject.file('signing.properties')
def signingProps = new Properties()
if (signingFile.exists()) {
    signingFile.withInputStream { signingProps.load(it) }
}

android {
    namespace 'com.onlyus.privatechat'
    compileSdk 35

    defaultConfig {
        applicationId 'com.onlyus.privatechat'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '2.0.0'
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


// Firebase configuration is private/local. Apply the plugin only when the user has configured Firebase.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.0.2')
    implementation 'com.google.firebase:firebase-messaging'
}
